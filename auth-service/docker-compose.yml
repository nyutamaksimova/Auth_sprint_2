
services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db

    ports:
      - "5432:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d auth_db" ]
      interval: 3s
      timeout: 3s
      retries: 20

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7

    ports:
      - "6379:6379"


  auth-service:
    build: .

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    env_file:
      - .env

    volumes:
      - .:/app

  jaeger:
    image: jaegertracing/all-in-one:latest

    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"


volumes:
  postgres_data: